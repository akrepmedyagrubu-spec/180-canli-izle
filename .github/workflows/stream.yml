name: HLS Stream Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla (LFS Destekli)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: FFmpeg Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Videolari Logola ve Tam TV Akışına Göre Diz
        run: |
          mkdir -p public

          # 1. YAYIN LOGOLU VİDEOLAR
          ffmpeg -y -i rj1.mp4 -i yayin_logo.png -filter_complex "[0:v][1:v]overlay=W-w-20:20" -c:a copy public/v_rj1.mp4
          ffmpeg -y -i rj2.mp4 -i yayin_logo.png -filter_complex "[0:v][1:v]overlay=W-w-20:20" -c:a copy public/v_rj2.mp4
          ffmpeg -y -i jenerik.mp4 -i yayin_logo.png -filter_complex "[0:v][1:v]overlay=W-w-20:20" -c:a copy public/v_jenerik.mp4
          ffmpeg -y -i akilli.mp4 -i yayin_logo.png -filter_complex "[0:v][1:v]overlay=W-w-20:20" -c:a copy public/v_akilli.mp4
          ffmpeg -y -i kv1.mp4 -i yayin_logo.png -filter_complex "[0:v][1:v]overlay=W-w-20:20" -c:a copy public/v_kv1.mp4
          ffmpeg -y -i kv2.mp4 -i yayin_logo.png -filter_complex "[0:v][1:v]overlay=W-w-20:20" -c:a copy public/v_kv2.mp4
          ffmpeg -y -i kv3.mp4 -i yayin_logo.png -filter_complex "[0:v][1:v]overlay=W-w-20:20" -c:a copy public/v_kv3.mp4

          # 2. REKLAM LOGOLU VİDEO
          ffmpeg -y -i reklam.mp4 -i reklam_logo.png -filter_complex "[0:v][1:v]overlay=W-w-20:20" -c:a copy public/v_reklam.mp4

          # 3. İSTEDİĞİN TAM TV AKIŞI PLAYLIST'İ
          cat <<EOF > public/playlist.txt
          file 'v_rj1.mp4'
          file 'v_reklam.mp4'
          file 'v_rj2.mp4'
          file 'v_jenerik.mp4'
          file 'v_akilli.mp4'
          file 'v_kv1.mp4'
          file 'v_rj1.mp4'
          file 'v_reklam.mp4'
          file 'v_rj2.mp4'
          file 'v_jenerik.mp4'
          file 'v_akilli.mp4'
          file 'v_kv2.mp4'
          file 'v_rj1.mp4'
          file 'v_reklam.mp4'
          file 'v_rj2.mp4'
          file 'v_jenerik.mp4'
          file 'v_akilli.mp4'
          file 'v_kv3.mp4'
          EOF

          # 4. HLS (.m3u8) Dönüştürme (Düzeltildi)
          cd public
          ffmpeg -y -f concat -safe 0 -i playlist.txt -c copy -f hls -hls_time 4 -hls_list_size 0 stream.m3u8

      - name: GitHub Pages Ayarla
        uses: actions/configure-pages@v5

      - name: Dosyalari Yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: GitHub Pages'e Yayinla
        id: deployment
        uses: actions/deploy-pages@v4
